<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据管理系统</title>
    <script>
        // 设备检测：手机端自动跳转到移动版
        (function() {
            // 检测是否为移动设备（通过User Agent和屏幕宽度）
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.innerWidth <= 768;
            
            // 获取当前文件名
            const pathname = location.pathname;
            let currentPage = pathname.split('/').pop();
            if (!currentPage) {
                // 如果获取失败，尝试从href获取
                currentPage = location.href.split('/').pop().split('?')[0];
            }
            
            // 如果已经是移动版页面，不跳转
            if (isMobile && !currentPage.includes('-mobile')) {
                // 映射到对应的移动版页面
                const mobileMap = {
                    'index.html': 'index-mobile.html',
                    'school-statistics.html': 'school-statistics-mobile.html',
                    'school-income-dashboard.html': 'school-income-dashboard-mobile.html'
                };
                const targetPage = mobileMap[currentPage] || 'index-mobile.html';
                // 使用相对路径跳转
                location.replace('./' + targetPage);
            }
        })();
    </script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .header h1 {
            font-size: 48px;
            font-weight: 700;
            color: white;
            margin-bottom: 15px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 18px;
            color: rgba(255,255,255,0.85);
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 5px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.25);
        }

        .card-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 22px;
            color: #333;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .card p {
            font-size: 14px;
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .card-btn {
            display: inline-block;
            padding: 14px 35px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102,126,234,0.4);
        }

        .card-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(102,126,234,0.5);
        }

        /* 不同卡片的不同颜色主题 */
        .card.students::before {
            background: linear-gradient(90deg, #11998e, #38ef7d);
        }
        .card.students .card-btn {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            box-shadow: 0 4px 15px rgba(17,153,142,0.4);
        }
        .card.students .card-btn:hover {
            box-shadow: 0 6px 20px rgba(17,153,142,0.5);
        }

        .card.income::before {
            background: linear-gradient(90deg, #f093fb, #f5576c);
        }
        .card.income .card-btn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 4px 15px rgba(245,87,108,0.4);
        }
        .card.income .card-btn:hover {
            box-shadow: 0 6px 20px rgba(245,87,108,0.5);
        }

        .card.tools::before {
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        /* 底部信息 */
        .footer {
            text-align: center;
            margin-top: 50px;
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }

        .footer a {
            color: white;
            text-decoration: none;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* 云端状态指示 */
        .cloud-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            font-size: 12px;
            color: white;
            margin-top: 10px;
        }

        .cloud-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #38ef7d;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 32px;
            }
            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 数据管理系统</h1>
            <p>学校数据管理一站式平台</p>
        </div>

        <div class="cards">
            <!-- 学校人数统计系统 -->
            <div class="card students">
                <div class="card-icon">👥</div>
                <h2>学校人数统计系统</h2>
                <p>统计各学校学生人数，支持栋数详情管理，数据可视化图表展示</p>
                <a href="school-statistics.html" class="card-btn">打开系统</a>
                <div class="cloud-badge">
                    <span class="dot"></span>
                    支持云端同步
                </div>
            </div>

            <!-- 收入仪表板 -->
            <div class="card income">
                <div class="card-icon">💰</div>
                <h2>学校项目收入日报</h2>
                <p>学校项目设备收入数据管理，支持日报、周报、月报分析，图表可视化</p>
                <a href="school-income-dashboard.html" class="card-btn">打开系统</a>
                <div class="cloud-badge">
                    <span class="dot"></span>
                    支持云端同步
                </div>
            </div>

            <!-- 工具卡片区域 -->
            <div class="card tools">
                <div class="card-icon">📊</div>
                <h2>经管报表分析系统</h2>
                <p>收入明细数据分析，项目趋势图表，合同运营分析，订单明细搜索</p>
                <a href="../经管报表_202604_upload.html" class="card-btn">打开系统</a>
                <div class="cloud-badge">
                    <span class="dot"></span>
                    支持云端同步
                </div>
            </div>
        </div>

        <div class="footer">
            <p>数据通过 JSONBin.io 云端存储 · 三个系统数据完全独立</p>
        </div>
    </div>
</body>
</html>
